<!doctype html>
<html lang="es" data-bs-theme="light" data-tema="__COLOR_POR_DEFECTO__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rutina</title>
    <meta name="description" content="Rutina de gimnasio semanal" />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rutina" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Aplica modo claro/oscuro y color antes de pintar para que no parpadee.
         El color guardado que ya no existe pasa al de por defecto. -->
    <script>
      (function () {
        var t = null, c = null;
        try { t = localStorage.getItem('rutina:tema'); c = localStorage.getItem('rutina:color'); } catch (e) {}
        var oscuro = t === 'oscuro' || (t !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', oscuro ? 'dark' : 'light');
        // Lista completada al compilar desde src/temas-color.ts.
        var colores = __COLORES__;
        document.documentElement.setAttribute('data-tema', colores.indexOf(c) >= 0 ? c : '__COLOR_POR_DEFECTO__');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
